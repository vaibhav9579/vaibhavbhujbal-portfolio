<svg width="480" height="600" viewBox="0 0 480 600" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Placeholder profile photo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="480" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1b2040"/>
      <stop offset="0.55" stop-color="#0d0f12"/>
      <stop offset="1" stop-color="#07080a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.7" cy="0.18" r="0.55">
      <stop offset="0" stop-color="#5b6fd8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5b6fd8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="480" height="600" fill="url(#bg)"/>
  <rect width="480" height="600" fill="url(#grid)"/>
  <rect width="480" height="600" fill="url(#glow)"/>

  <g transform="translate(240 250)" fill="#f3f4f6" fill-opacity="0.16">
    <circle r="72" cy="-20"/>
    <path d="M -128 190 C -128 78 -70 8 0 8 C 70 8 128 78 128 190 Z"/>
  </g>

  <g fill="#9498a1" fill-opacity="0.9" font-family="sans-serif" text-anchor="middle">
    <text x="240" y="522" font-size="20" letter-spacing="2" font-weight="600">YOUR PHOTO HERE</text>
    <text x="240" y="552" font-size="13" fill-opacity="0.65">Replace /public/profile-photo.svg with a real headshot</text>
  </g>

  <rect x="1" y="1" width="478" height="598" rx="0" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
</svg>
